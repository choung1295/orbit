name: CCTV Status Check

# 하루 10회 실행 (144분 간격 = 2시간 24분)
# 시내 CCTV를 30묶음으로 나눠 3일 × 하루 10회 순환 점검
# 샤드 자동 계산: (UTC일 % 3) × 10 + floor(UTC분 / 144) % 10
#
# UTC 스케줄 → KST (UTC+9)
#   00:00 → 09:00  timeSlot 0
#   02:24 → 11:24  timeSlot 1
#   04:48 → 13:48  timeSlot 2
#   07:12 → 16:12  timeSlot 3
#   09:36 → 18:36  timeSlot 4
#   12:00 → 21:00  timeSlot 5
#   14:24 → 23:24  timeSlot 6
#   16:48 → 01:48  timeSlot 7
#   19:12 → 04:12  timeSlot 8
#   21:36 → 06:36  timeSlot 9

on:
  schedule:
    - cron: '0 0 * * *'    # KST 09:00  timeSlot 0
    - cron: '24 2 * * *'   # KST 11:24  timeSlot 1
    - cron: '48 4 * * *'   # KST 13:48  timeSlot 2
    - cron: '12 7 * * *'   # KST 16:12  timeSlot 3
    - cron: '36 9 * * *'   # KST 18:36  timeSlot 4
    - cron: '0 12 * * *'   # KST 21:00  timeSlot 5
    - cron: '24 14 * * *'  # KST 23:24  timeSlot 6
    - cron: '48 16 * * *'  # KST 01:48  timeSlot 7
    - cron: '12 19 * * *'  # KST 04:12  timeSlot 8
    - cron: '36 21 * * *'  # KST 06:36  timeSlot 9
  workflow_dispatch:
    inputs:
      shard_index:
        description: '샤드 인덱스 (0-29, 미입력 시 날짜+시간 기반 자동 계산)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 시내 CCTV 상태 점검
        run: node scripts/cctv-check.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHARD_INDEX: ${{ github.event.inputs.shard_index }}
